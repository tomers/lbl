[[example]]
id          = "iter-skip-take"
section     = "Iterators"
title       = "`--skip` and `--take`"
description = "Skip the first five of ten shell-generated records, then print the next three (users 6–8)."
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "batch-selection"
caption     = "DYMO 2112286 · 25×25 mm"
media       = "2112286"
hide_cd     = true
xargs       = "seq 1 10"
composite   = "side_by_side"
single_line = true
batch_args  = ["--skip", "5", "--take", "3"]
render_args = ["--padding-mm", "0"]
args        = ["--template", "User #{{ it }}"]
