[[example]]
id          = "shell-template"
section     = "Templating"
title       = "Command pipelining"
description = """Pipe one JSON object per line into `lbl print` — each line becomes `--data` for one badge."""
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "shell-iteration-seq-and-xargs"
caption     = "DYMO 2112286 · 25×25 mm"
media       = "2112286"
dir         = "batch-card"
hide_cd     = true
xargs       = "cat people.ndjson"
composite   = "side_by_side"
single_line = true
render_args = ["--padding-mm", "0", "--qr-size-mm", "5"]
args        = ["--template", "card.html"]

[[example]]
id          = "iter-first"
section     = "Iterators"
title       = "`--first`"
description = "Print only the first label from a batch selection."
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "batch-selection"
caption     = "DYMO 2112286 · 25×25 mm"
media       = "2112286"
dir         = "batch-card"
hide_cd     = false
single_line = true
batch_args  = ["--first"]
render_args = ["--padding-mm", "0", "--qr-size-mm", "5"]
args        = ["--template", "card.html", "--data", "people.json"]

[[example]]
id          = "iter-index"
section     = "Iterators"
title       = "`--index`"
description = "Select a label by zero-based index — here, Bob at index 1."
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "batch-selection"
caption     = "DYMO 2112286 · 25×25 mm"
media       = "2112286"
dir         = "batch-card"
hide_cd     = false
single_line = true
batch_args  = ["--index", "1"]
render_args = ["--padding-mm", "0", "--qr-size-mm", "5"]
args        = ["--template", "card.html", "--data", "people.json"]

[[example]]
id          = "iter-filter"
section     = "Iterators"
title       = "`--filter`"
description = "Keep only labels whose data fields contain a substring (case-insensitive)."
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "batch-selection"
caption     = "DYMO 2112286 · 25×25 mm"
media       = "2112286"
dir         = "batch-card"
hide_cd     = false
single_line = true
batch_args  = ["--filter", "Bob"]
