# Source of truth for label examples shown in the README and docs.
# Regenerate with: just doc-examples

[defaults]
protocol = "virtual"

[[example]]
id          = "sopranos-cards"
title       = "Complex HTML batch"
description = "Rich HTML with photos, QR, and barcodes — Tony and Carmela identity cards from the test suite."
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "template--data"
caption     = "DYMO 99014 · 54×101 mm"
media       = "99014"
dir         = "sopranos"
hide_cd     = true
single_line = true
composite   = "side_by_side"
files       = [{ path = "sopranos.lbl", lang = "text" }]
args        = ["--template", "sopranos.lbl", "--orientation", "portrait"]
render_args = ["--font-size-mm", "2.6", "--qr-size-mm", "12", "--padding-mm", "1"]

[[example]]
id                    = "inline-syntax"
title                 = "Inline mini-syntax"
description           = "Text mini-syntax embeds QR codes, barcodes, and relative font scaling in one string."
doc                   = "guides/printing-text.md"
doc_title             = "Printing text"
doc_section           = "inline-mini-syntax-default"
caption               = "80×20 mm"
media                 = ""
width_mm              = 80
length_mm             = 20
dpi                   = 203
show_dpi              = false
hide_media_in_command = true
single_line           = true
render_args           = ["--orientation", "portrait", "--padding-mm", "0", "--qr-size-mm", "8", "--barcode-height-mm", "7"]
args                  = ["--text", "Text [[size:2.5:Title]][[barcode:Barcode]][[qr:QR]]"]

[[example]]
id = "element-gap"
title = "Element spacing"
description = """Inline elements in a row are separated by `element_gap_mm` (default 4 mm).
Override with `--element-gap-mm`, `LBL_STYLE__ELEMENT_GAP_MM`, or config
(see [configuration precedence](docs/src/guides/configuration.md#configuration))."""
doc = "guides/configuration.md"
doc_title = "Configuration"
doc_section = "style-fonts-qr-barcodes"
caption = "200×30 mm @ 300 dpi"
media = ""
width_mm = 200
length_mm = 30
dpi = 300
show_dpi = false
hide_media_in_command = true
separate_images = true
single_line = true
render_args = ["--orientation", "portrait", "--padding-mm", "0", "--qr-size-mm", "10", "--barcode-height-mm", "9"]
args = ["--text", "Text [[size:2.5:Title]][[barcode:Barcode]][[qr:QR]]"]
compare = [{ label = "default element gap" }, { label = "element gap 10 mm", args = ["--element-gap-mm", "10"] }]

[[example]]
id = "markdown-label"
title = "Markdown input"
description = "Headings, emphasis, and inline directives compose via `--markdown`."
doc = "guides/printing-text.md"
doc_title = "Printing text"
caption = "NIIMBOT 12×40 mm @ 203 dpi"
media = "12x40"
dpi = 203
render_args = [
  "--orientation",
  "portrait",
  "--padding-mm",
  "0",
  "--qr-size-mm",
  "8",
  "--font-size-mm",
  "1.6",
  "--element-gap-mm",
  "2",
]
args = ["--markdown", """# Order #1234

⚠️ Caution **fragile**

[[qr:https://track/1234]]"""]

[[example]]
id = "label-align"
title = "Label alignment"
description = "Position content on the label with `--label-align` and `--label-valign`."
doc = "guides/configuration.md"
doc_title = "Configuration"
doc_section = "style-fonts-qr-barcodes"
caption = "90×15 mm @ 300 dpi"
media = ""
width_mm = 90
length_mm = 15
dpi = 300
hide_media_in_command = true
compare_command_comments = false
single_line = true
composite = "grid_3x3"
render_args = ["--orientation", "portrait", "--padding-mm", "0", "--font-size-mm", "6", "--label-fit", "content"]
args = []
compare = [
  { args = [
    "--label-align",
    "start",
    "--label-valign",
    "start",
    "--text",
    "top-left",
  ] },
  { args = [
    "--label-align",
    "center",
    "--label-valign",
    "start",
    "--text",
    "top-center",
  ] },
  { args = [
    "--label-align",
    "end",
    "--label-valign",
    "start",
    "--text",
    "top-right",
  ] },
  { args = [
    "--label-align",
    "start",
    "--label-valign",
    "center",
    "--text",
    "center-left",
  ] },
  { args = [
    "--label-align",
    "center",
    "--label-valign",
    "center",
    "--text",
    "center",
  ] },
  { args = [
    "--label-align",
    "end",
    "--label-valign",
    "center",
    "--text",
    "center-right",
  ] },
  { args = [
    "--label-align",
    "start",
    "--label-valign",
    "end",
    "--text",
    "bottom-left",
  ] },
  { args = [
    "--label-align",
    "center",
    "--label-valign",
    "end",
    "--text",
    "bottom-center",
  ] },
  { args = [
    "--label-align",
    "end",
    "--label-valign",
    "end",
    "--text",
    "bottom-right",
  ] },
]

[[example]]
id = "zero-padding"
title = "Inner padding"
description = "Inner padding (`--padding-mm`, default 2 mm) gutters content from the label edge."
doc = "guides/configuration.md"
doc_title = "Configuration"
doc_section = "padding-and-insets"
caption = "54×15 mm @ 300 dpi"
media = ""
width_mm = 54
length_mm = 15
dpi = 300
hide_media_in_command = true
composite = "side_by_side"
single_line = true
render_args = ["--orientation", "portrait"]
args = ["--text", "Hi"]
compare = [
  { label = "padding 0 (left)", args = [
    "--padding-mm",
    "0",
  ] },
  { label = "padding 4 mm (right)", args = [
    "--padding-mm",
    "4",
  ] },
]

[[example]]
id          = "config-defaults"
title       = "Config-driven print defaults"
description = "When transport and protocol live in `lbl.toml`, the run command only needs label content."
doc         = "guides/configuration.md"
doc_title   = "Configuration"
doc_section = "print-defaults-lbl-print"
caption     = "NIIMBOT 12×40 mm @ 203 dpi"
media       = "12x40"
dpi         = 203
dir         = "config-defaults"
hide_cd     = true
single_line = true
render_args = ["--qr-size-mm", "10"]
files       = [{ path = "lbl.toml", lang = "toml" }]
args        = ["--text", "Hello [[qr:https://x/p]]"]

[[example]]
id = "supersample"
title = "Supersampling for print quality"
description = """Side by side: `--supersample 1` (left) vs `--supersample 8` (right).
More render dots before downscaling yield sharper text and fine detail."""
doc = "guides/rendering-quality.md"
doc_title = "Rendering quality"
doc_section = "how-to-set-it"
caption = "12×40 mm"
media = "12x40"
hide_media_in_command = true
render_args = ["--orientation", "landscape", "--padding-mm", "0", "--font-size-mm", "3"]
composite = "side_by_side"
single_line = true
args = ["--text", "Supersample"]
compare = [
  { label = "Supersample 1", args = [
    "--supersample",
    "1",
    "--text",
    "Supersample 1",
  ] },
  { label = "Supersample 8", args = [
    "--supersample",
    "8",
    "--text",
    "Supersample 8",
  ] },
]

[[example]]
id = "niimbot-catalog"
title = "Catalog media SKU"
description = "Pick a die-cut size from the bundled catalog with `--media` instead of raw `--width-mm` / `--length-mm`."
doc = "guides/printers-media.md"
doc_title = "Printers & media"
doc_section = "niimbot"
caption = "NIIMBOT 12×40 & 12×22 mm @ 203 dpi"
media = ""
dpi = 203
show_media = true
show_dpi = false
composite = "side_by_side"
single_line = true
args = []
compare = [
  { label = "12×40", args = [
    "--media",
    "12x40",
    "--text",
    "12x40",
  ] },
  { label = "12×22", args = [
    "--media",
    "12x22",
    "--text",
    "12x22",
  ] },
]

[[example]]
id          = "fixed-dimensions"
title       = "Explicit media dimensions"
description = "When no catalog SKU fits, pass `--width-mm` and `--length-mm` directly."
doc         = "guides/printers-media.md"
doc_title   = "Printers & media"
doc_section = "media"
caption     = "30×20 mm"
media       = ""
width_mm    = 30
length_mm   = 20
dpi         = 203
show_dpi    = false
args        = ["--text", "30×20"]

[[example]]
id          = "batch-card"
section     = "Templating"
title       = "HTML template"
description = "One HTML layout rendered against a JSON array — name badges with QR for Alice and Bob."
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "template--data"
caption     = "DYMO 2112286 · 25×25 mm"
media       = "2112286"
dir         = "batch-card"
composite   = "side_by_side"
files       = [{ path = "card.html", lang = "html" }, { path = "people.json", lang = "json" }]
render_args = ["--padding-mm", "1", "--qr-size-mm", "10", "--font-size-mm", "1.8", "--element-gap-mm", "2"]
args        = ["--template", "card.html", "--data", "people.json"]

[[example]]
id          = "batch-combined-text"
section     = "Templating"
title       = "Single-file template and data (text)"
description = "Data and template in one file — frontmatter plus a text body with inline mini-syntax."
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "single-file-frontmatter"
caption     = "DYMO 2112286 · 25×25 mm"
media       = "2112286"
dir         = "batch-combined"
composite   = "side_by_side"
files       = [{ path = "combined.txt", lang = "text" }]
render_args = ["--padding-mm", "1", "--qr-size-mm", "10", "--font-size-mm", "1.8", "--element-gap-mm", "2"]
args        = ["--template", "combined.txt"]

[[example]]
id           = "batch-combined-markdown"
section      = "Templating"
title        = "Single-file template and data (markdown)"
description  = "Same frontmatter pattern with a Markdown body (`.md` extension)."
doc          = "guides/batch-printing.md"
doc_title    = "Batch printing"
doc_section  = "single-file-frontmatter"
