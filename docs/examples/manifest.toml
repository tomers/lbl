# Source of truth for label examples shown in the README and docs.
# Regenerate with: just doc-examples
#
# Each [[example]] defines:
#   - id: output image basename under docs/src/generated/images/
#   - title: feature headline
#   - description: one or two sentences on what the example demonstrates
#   - doc: path under docs/src/ (without prefix)
#   - doc_section: optional mdBook/GitHub heading anchor (no leading #)
#   - caption: media size line shown beside the command
#   - media: catalog SKU or size key passed to lbl print (not shown in docs)
#   - dpi: optional DPI override (NIIMBOT tape)
#   - dir: optional subdirectory under docs/examples/ to run from
#   - files: optional [{ path, lang }] source files to embed before the command
#   - args: lbl print flags shown in the abbreviated command (content/layout only)
#   - render_args: extra lbl print flags used for rendering only (omitted from docs)
#   - show_media: when true, include --media (and --dpi when set) in the documented command
#   - compare: render each entry side by side (e.g. supersample 1 vs 8); args merge over `args`
#   - composite: optional "side_by_side" to stitch multi-label batch output into one PNG
#   - separate_images: keep one PNG per label instead of compositing (batch / xargs)
#   - xargs: optional shell producer (e.g. "seq 1 2") — runs lbl print once per line via xargs

[defaults]
protocol    = "virtual"
supersample = 2

[[example]]
id = "inline-syntax"
title = "Inline mini-syntax"
description = """Text mini-syntax embeds QR codes, barcodes, and relative font scaling in one string.
On wide media the elements flow in a row; spacing comes from `element_gap_mm` in config (override with `LBL_STYLE__ELEMENT_GAP_MM`)."""
doc = "guides/printing-text.md"
doc_title = "Printing text"
doc_section = "inline-mini-syntax-default"
caption = "DYMO 11352 · 25×54 mm"
media = "11352"
composite = "side_by_side"
args = [
  "--text",
  "Ship {{size:1.2:Alice}}{{barcode:L42}}{{qr:https://track/42}}",
  "--orientation",
  "landscape",
  "--qr-size-mm",
  "9",
  "--barcode-height-mm",
  "7",
  "--padding-mm",
  "1",
]
compare = [
  { label = "default element gap (left)" },
  { label = "element gap 8 mm (right)", env = { LBL_STYLE__ELEMENT_GAP_MM = "8" } },
]

[[example]]
id = "markdown-label"
title = "Markdown input"
description = "Headings, emphasis, and inline directives compose via `--markdown`."
doc = "guides/printing-text.md"
doc_title = "Printing text"
caption = "DYMO 11352 · 25×54 mm"
media = "11352"
args = ["--markdown", """# Order 44

Ship **fast** to dock 4

{{qr:https://track/42}}""", "--orientation", "portrait"]

[[example]]
id = "batch-card"
title = "Batch HTML template"
description = "One HTML layout rendered against a JSON array — here, name badges with QR for two people."
doc = "guides/batch-printing.md"
doc_title = "Batch printing"
doc_section = "template--data"
caption = "DYMO 11352 · 25×54 mm"
media = "11352"
dir = "batch-card"
separate_images = true
files = [{ path = "card.html", lang = "html" }, { path = "people.json", lang = "json" }]
args = [
  "--template",
  "card.html",
  "--template-format",
  "html",
  "--data",
  "people.json",
  "--orientation",
  "portrait",
  "--qr-size-mm",
  "9",
  "--padding-mm",
  "1",
]

[[example]]
id = "batch-combined"
title = "Single-file template and data"
description = "Data and template can live in one file — frontmatter holds the records, the body is the layout."
doc = "guides/batch-printing.md"
doc_title = "Batch printing"
doc_section = "single-file-frontmatter"
caption = "DYMO 11352 · 25×54 mm"
media = "11352"
dir = "batch-combined"
separate_images = true
files = [{ path = "combined.html", lang = "html" }]
args = [
  "--template",
  "combined.html",
  "--template-format",
  "html",
  "--each",
  "/items",
  "--orientation",
  "portrait",
  "--padding-mm",
  "1",
]

[[example]]
id = "shell-template"
title = "Linux pipeline batching"
description = """Pipe shell output into `lbl print` — `seq | xargs -n1 lbl print … --data` runs once per value.
`{{ it }}` is the scalar passed on each invocation."""
doc = "guides/batch-printing.md"
doc_title = "Batch printing"
doc_section = "shell-iteration-seq-and-xargs"
caption = "NIIMBOT 12×22 mm @ 203 dpi"
media = "niimbot-12x22"
dpi = 203
xargs = "seq 1 3"
separate_images = true
args = ["--template", "User #{{ it }}", "--padding-mm", "0"]

[[example]]
id = "label-align"
title = "Cross-axis alignment"
description = "Position content across the label width with `--label-align` (`start`, `center`, or `end`)."
doc = "guides/configuration.md"
doc_title = "Configuration"
doc_section = "style-fonts-qr-barcodes"
caption = "DYMO 11352 · 25×54 mm"
media = "11352"
composite = "side_by_side"
args = ["--text", "Align", "--orientation", "landscape"]
compare = [
  { label = "start (left)", args = [
    "--label-align",
    "start",
  ] },
  { label = "center (middle)", args = [
    "--label-align",
    "center",
  ] },
  { label = "end (right)", args = [
    "--label-align",
    "end",
  ] },
]

[[example]]
id = "zero-padding"
title = "Inner padding"
description = "Inner padding (`--padding-mm`, default 2 mm) gutters content from the label edge. Compare none vs generous padding."
doc = "guides/configuration.md"
doc_title = "Configuration"
doc_section = "padding-and-insets"
caption = "NIIMBOT 12×30 mm @ 203 dpi"
media = "12x30"
dpi = 203
composite = "side_by_side"
args = ["--text", "ABC 123"]
compare = [
  { label = "padding 0 (left)", args = [
    "--padding-mm",
    "0",
  ] },
  { label = "padding 8 mm (right)", args = [
    "--padding-mm",
    "8",
  ] },
]

[[example]]
id          = "config-defaults"
title       = "Config-driven print defaults"
description = "When transport and protocol live in `lbl.toml`, the run command only needs label content."
doc         = "guides/configuration.md"
doc_title   = "Configuration"
doc_section = "print-defaults-lbl-print"
caption     = "NIIMBOT 12×22 mm @ 203 dpi"
media       = "niimbot-12x22"
dpi         = 203
dir         = "config-defaults"
dir_comment = "lbl.toml in this directory applies"
files       = [{ path = "lbl.toml", lang = "toml" }]
args        = ["--text", "Hello {{qr:https://x/p}}"]

[[example]]
id = "supersample"
title = "Supersampling for print quality"
description = """Side by side: `--supersample 1` (left) vs `--supersample 8` (right).
More render dots before downscaling yield sharper barcodes and small type."""
doc = "guides/rendering-quality.md"
doc_title = "Rendering quality"
doc_section = "how-to-set-it"
caption = "DYMO 11352 · 25×54 mm"
media = "11352"
dir = "supersample"
composite = "side_by_side"
files = [{ path = "pattern.html", lang = "html" }]
args = ["--html", "pattern.html", "--orientation", "landscape"]
compare = [
  { label = "supersample 1 (left)", args = [
    "--supersample",
    "1",
  ] },
  { label = "supersample 8 (right)", args = [
    "--supersample",
    "8",
  ] },
]

[[example]]
id          = "niimbot-catalog"
title       = "Catalog media SKU"
description = "Pick a die-cut size from the bundled catalog with `--media` instead of passing raw `--width-mm` / `--length-mm`."
doc         = "guides/printers-media.md"
doc_title   = "Printers & media"
doc_section = "niimbot"
caption     = "NIIMBOT 12×40 mm @ 203 dpi"
media       = "12x40"
dpi         = 203
show_media  = true
args        = ["--text", "Dock 4"]

[[example]]
id          = "fixed-dimensions"
title       = "Explicit media dimensions"
description = "When no catalog SKU fits, pass `--width-mm`, `--length-mm`, and `--dpi` directly."
doc         = "guides/printers-media.md"
doc_title   = "Printers & media"
doc_section = "media"
caption     = "56×89 mm @ 300 dpi"
media       = ""
width_mm    = 56
length_mm   = 89
dpi         = 300
args        = ["--text", "Receipt\nItem ×2  $18.00\nTotal      $36.00"]
