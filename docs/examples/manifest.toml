media        = "2112286"
dir          = "batch-combined"
skip_preview = true
files        = [{ path = "combined.md", lang = "markdown" }]
args         = ["--template", "combined.md"]

[[example]]
id           = "batch-combined-html"
section      = "Templating"
title        = "Single-file template and data (html)"
description  = "Same frontmatter pattern with an HTML body (`.html` or `.lbl` extension)."
doc          = "guides/batch-printing.md"
doc_title    = "Batch printing"
doc_section  = "single-file-frontmatter"
