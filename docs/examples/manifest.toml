# Source of truth for label examples shown in the README and docs.
# Regenerate with: just doc-examples

[defaults]
protocol    = "virtual"
supersample = 2

[[example]]
id = "inline-syntax"
title = "Inline mini-syntax"
description = """Text mini-syntax embeds QR codes, barcodes, and relative font scaling in one string.
Elements flow in a row; spacing comes from `element_gap_mm` in config (override with `LBL_STYLE__ELEMENT_GAP_MM`)."""
doc = "guides/printing-text.md"
doc_title = "Printing text"
doc_section = "inline-mini-syntax-default"
caption = "DYMO 11352 · 25×54 mm"
media = "11352"
separate_images = true
render_args = ["--orientation", "landscape"]
args = ["--text", "Ship {{size:1.2:Alice}}{{barcode:L42}}{{qr:https://track/42}}"]
compare = [{ label = "default element gap" }, { label = "element gap 8 mm", env = { LBL_STYLE__ELEMENT_GAP_MM = "8" } }]

[[example]]
id = "markdown-label"
title = "Markdown input"
description = "Headings, emphasis, and inline directives compose via `--markdown`."
doc = "guides/printing-text.md"
doc_title = "Printing text"
caption = "NIIMBOT 12×22 mm @ 203 dpi"
media = "niimbot-12x22"
dpi = 203
args = ["--markdown", """# Order 44

Ship **fast** to dock 4

{{qr:https://track/42}}"""]

[[example]]
id = "label-align"
title = "Cross-axis alignment"
description = "Position content across the label width with `--label-align` (`start`, `center`, or `end`)."
doc = "guides/configuration.md"
doc_title = "Configuration"
doc_section = "style-fonts-qr-barcodes"
caption = "54×15 mm @ 300 dpi"
media = ""
width_mm = 54
length_mm = 15
dpi = 300
separate_images = true
single_line = true
render_args = ["--orientation", "landscape"]
args = []
compare = [
  { label = "align left", args = [
    "--label-align",
    "start",
    "--text",
    "align left",
  ] },
  { label = "align center", args = [
    "--label-align",
    "center",
    "--text",
    "align center",
  ] },
  { label = "align right", args = [
    "--label-align",
    "end",
    "--text",
    "align right",
  ] },
]

[[example]]
id = "zero-padding"
title = "Inner padding"
description = "Inner padding (`--padding-mm`, default 2 mm) gutters content from the label edge."
doc = "guides/configuration.md"
doc_title = "Configuration"
doc_section = "padding-and-insets"
caption = "54×15 mm @ 300 dpi"
media = ""
width_mm = 54
length_mm = 15
dpi = 300
composite = "side_by_side"
single_line = true
render_args = ["--orientation", "landscape"]
args = ["--text", "Hi"]
compare = [
  { label = "padding 0 (left)", args = [
    "--padding-mm",
    "0",
  ] },
  { label = "padding 4 mm (right)", args = [
    "--padding-mm",
    "4",
  ] },
]

[[example]]
id          = "config-defaults"
title       = "Config-driven print defaults"
description = "When transport and protocol live in `lbl.toml`, the run command only needs label content."
doc         = "guides/configuration.md"
doc_title   = "Configuration"
doc_section = "print-defaults-lbl-print"
caption     = "NIIMBOT 12×40 mm @ 203 dpi"
media       = "12x40"
dpi         = 203
dir         = "config-defaults"
hide_cd     = true
single_line = true
files       = [{ path = "lbl.toml", lang = "toml" }]
args        = ["--text", "Hello {{qr:https://x/p}}"]

[[example]]
id = "supersample"
title = "Supersampling for print quality"
description = """Side by side: `--supersample 1` (left) vs `--supersample 8` (right).
More render dots before downscaling yield sharper barcodes and small type."""
doc = "guides/rendering-quality.md"
doc_title = "Rendering quality"
doc_section = "how-to-set-it"
caption = "DYMO 11352 · 25×54 mm"
media = "11352"
composite = "side_by_side"
single_line = true
args = ["--text", "{{barcode:EAN13:4006381333931}} {{size:0.7:SKU 7788}}"]
compare = [
  { label = "supersample 1 (left)", args = [
    "--supersample",
    "1",
  ] },
  { label = "supersample 8 (right)", args = [
    "--supersample",
    "8",
  ] },
]

[[example]]
id          = "niimbot-catalog"
title       = "Catalog media SKU"
description = "Pick a die-cut size from the bundled catalog with `--media` instead of raw `--width-mm` / `--length-mm`."
doc         = "guides/printers-media.md"
doc_title   = "Printers & media"
doc_section = "niimbot"
caption     = "NIIMBOT 12×40 mm @ 203 dpi"
media       = "12x40"
dpi         = 203
show_media  = true
show_dpi    = false
single_line = true
args        = ["--text", "12x40"]

[[example]]
id          = "niimbot-catalog-2"
title       = "Another catalog SKU"
description = "Another die-cut size from the same catalog — only `--media` and content change."
doc         = "guides/printers-media.md"
doc_title   = "Printers & media"
doc_section = "niimbot"
caption     = "NIIMBOT 12×22 mm @ 203 dpi"
media       = "12x22"
dpi         = 203
show_media  = true
show_dpi    = false
single_line = true
args        = ["--text", "12x22"]

[[example]]
id          = "fixed-dimensions"
title       = "Explicit media dimensions"
description = "When no catalog SKU fits, pass `--width-mm`, `--length-mm`, and `--dpi` directly."
doc         = "guides/printers-media.md"
doc_title   = "Printers & media"
doc_section = "media"
caption     = "48×76 mm @ 300 dpi"
media       = ""
width_mm    = 48
length_mm   = 76
dpi         = 300
args        = ["--text", "Receipt\nItem ×2  $18.00\nTotal      $36.00"]

[[example]]
id          = "sopranos-cards"
title       = "Complex HTML batch"
description = "Rich HTML with photos, QR, and barcodes — Tony and Carmela identity cards from the test suite."
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "template--data"
caption     = "DYMO 99014 · 54×101 mm"
media       = "99014"
dir         = "sopranos"
hide_cd     = true
single_line = true
composite   = "side_by_side"
files       = [{ path = "sopranos.lbl", lang = "text" }]
args        = ["--template", "sopranos.lbl", "--template-format", "html"]
render_args = ["--qr-size-mm", "12", "--padding-mm", "1"]

[[example]]
id          = "batch-card"
section     = "Templating"
title       = "HTML template"
description = "One HTML layout rendered against a JSON array — name badges with QR for Alice and Bob."
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "template--data"
caption     = "DYMO 2112286 · 25×25 mm"
media       = "2112286"
dir         = "batch-card"
composite   = "side_by_side"
files       = [{ path = "card.html", lang = "html" }, { path = "people.json", lang = "json" }]
render_args = ["--padding-mm", "0", "--qr-size-mm", "8"]
args        = ["--template", "card.html", "--template-format", "html", "--data", "people.json"]

[[example]]
id          = "batch-combined"
section     = "Templating"
title       = "Single-file template and data (HTML)"
description = "Data and template in one file — a JSON frontmatter array batches without `--each`."
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "single-file-frontmatter"
caption     = "DYMO 2112286 · 25×25 mm"
media       = "2112286"
dir         = "batch-combined"
hide_cd     = true
composite   = "side_by_side"
files       = [{ path = "combined.html", lang = "html" }]
render_args = ["--padding-mm", "0", "--qr-size-mm", "8"]
args        = ["--template", "combined.html", "--template-format", "html"]

[[example]]
id          = "batch-combined-lbl"
section     = "Templating"
title       = "Single-file template and data (LBL)"
description = "The same frontmatter batch works in a `.lbl` file — HTML template syntax inside."
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "single-file-frontmatter"
caption     = "DYMO 2112286 · 25×25 mm"
media       = "2112286"
dir         = "batch-combined"
