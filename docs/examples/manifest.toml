[[example]]
id          = "shell-template"
section     = "Templating"
title       = "Command pipelining"
description = """Pipe one JSON object per line into `lbl print` — each line becomes `--data` for one badge."""
doc         = "guides/batch-printing.md"
doc_title   = "Batch printing"
doc_section = "shell-iteration-seq-and-xargs"
caption     = "DYMO 2112286 · 25×25 mm"
media       = "2112286"
dir         = "batch-card"
xargs       = "cat people.ndjson"
composite   = "side_by_side"
single_line = true
render_args = ["--padding-mm", "0", "--qr-size-mm", "8"]
args        = ["--template", "card.html", "--template-format", "html"]

