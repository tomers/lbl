# Pre-commit hooks for lbl. Install once with `pre-commit install` (and
# `pre-commit install --hook-type commit-msg`). Tooling is provided by mise.
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
      - id: markdownlint
        name: markdownlint (fix)
        alias: markdownlint-fix
        args: ["--fix"]
        stages: [manual]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: local
    hooks:
      - id: rust
        name: rust (clippy + rustfmt, warnings as errors; autofixes on failure)
        entry: just rust-pre-commit
        language: system
        files: \.rs$|(^|/)Cargo\.(toml|lock)$
        pass_filenames: false
        verbose: true
