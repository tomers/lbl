# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: \.min\.js$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: scripts/shellcheck-strict.sh
        language: script
        types: [shell]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        name: markdownlint
        exclude: ^docs/src/SUMMARY\.md$
      - id: markdownlint
        name: markdownlint (fix)
        alias: markdownlint-fix
        args: ['--fix']
        stages: [manual]
        exclude: ^docs/src/SUMMARY\.md$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(json|ya?ml|css|tsx?|jsx?|mjs|cjs)$
        exclude: ^(\.markdownlint\.json|.*\.min\.js)$

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: local
    hooks:
      - id: rust
        name: rust (clippy + rustfmt, warnings as errors; autofixes on failure)
        entry: just rust-pre-commit
        language: system
        files: \.rs$|(^|/)Cargo\.(toml|lock)$
        pass_filenames: false
        verbose: true
