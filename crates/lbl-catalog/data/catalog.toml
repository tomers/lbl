# Bundled catalog for lbl.
#
# [[entries]] describe known media SKUs. `keys` lists all SKUs/aliases that
# resolve to the entry (the first is canonical). Dimensions are physical
# (millimeters); device resolution comes from the target printer.
#
# [[printers]] describe known printer models: protocol, maturity, native DPI,
# head width, `supported_media`, and `connections` (USB, serial, Bluetooth,
# network). Maturity is `verified` (on-hand hardware), `supported` (same
# protocol as a verified model), or `experimental` (protocol not yet
# exercised on real hardware by us).
#
# Image policy: only set image.redistributable = true when the license clearly
# permits bundling/redistribution. Otherwise the URL is hotlinked for display.
#
# DYMO LabelWriter data sourced from https://dymo.eu/en/labels-tapes/labelwriter-labels.html
# and US SKU cross-references from https://www.dymo.com/ and https://www.labelcity.com/

