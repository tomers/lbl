[package]
name                   = "lbl-server"
description            = "HTTP API (axum) for lbl: config, catalog, printers, preview, and print."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[[bin]]
name = "lbl-server"
path = "src/bin/lbl-server.rs"

[dependencies]
lbl-core           = { workspace = true }
lbl-config         = { workspace = true }
lbl-catalog        = { workspace = true }
lbl                = { path = "../lbl" }
lbl-template       = { workspace = true }
lbl-transpile-html = { workspace = true }
lbl-device         = { workspace = true }
lbl-encode         = { workspace = true }
lbl-driver-file    = { workspace = true }
lbl-render         = { workspace = true }
lbl-dither         = { workspace = true }
lbl-spool          = { workspace = true }

serde              = { workspace = true }
serde_json         = { workspace = true }
base64             = { workspace = true }
anyhow             = { workspace = true }
clap               = { workspace = true }
lbl-cli            = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
axum               = "0.8"
tower-http         = { version = "0.7", features = ["cors", "trace"] }

[dev-dependencies]
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
