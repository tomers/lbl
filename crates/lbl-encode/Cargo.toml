[package]
name                   = "lbl-encode"
description            = "Select a printer driver by protocol and encode a 1-bit bitmap into protocol bytes."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[[bin]]
name              = "lbl-encode"
path              = "src/bin/lbl-encode.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# CLI binary deps (not needed by library consumers, including wasm32).
cli = ["dep:clap", "dep:lbl-cli", "dep:anyhow", "dep:lbl-pattern"]

[dependencies]
lbl-core              = { workspace = true }
lbl-driver-api        = { workspace = true }
lbl-driver-dymo       = { workspace = true }
lbl-driver-escpos     = { workspace = true }
lbl-driver-zpl        = { workspace = true }
lbl-driver-esclabel   = { workspace = true }
lbl-driver-tspl       = { workspace = true }
lbl-driver-slcs       = { workspace = true }
lbl-driver-ezpl       = { workspace = true }
lbl-driver-sbpl       = { workspace = true }
lbl-driver-dpl        = { workspace = true }
lbl-driver-tpcl       = { workspace = true }
lbl-driver-niimbot    = { workspace = true }
lbl-driver-letratag   = { workspace = true }
lbl-driver-brother-ql = { workspace = true }
lbl-driver-brother-pt = { workspace = true }
lbl-driver-file       = { workspace = true }
lbl-driver-console    = { workspace = true }
thiserror             = { workspace = true }
clap                  = { workspace = true, optional = true }
lbl-cli               = { workspace = true, optional = true }
anyhow                = { workspace = true, optional = true }
lbl-pattern           = { workspace = true, optional = true }
