[package]
name = "lbl-spool"
description = "Internal print spooler for lbl: job queue, sequential dispatch, per-item cut control, retry, and disconnect handling."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lbl-spool"
path = "src/bin/lbl-spool.rs"

[features]
default = ["usb"]
usb = ["lbl-device/usb"]

[dependencies]
lbl-core = { workspace = true }
lbl-device = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
