[package]
name                   = "lbl"
description            = "The lbl orchestrator: runs the label-printing pipeline and its individual stages."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
rust-version.workspace = true
build                  = "build.rs"

[[bin]]
name = "lbl"
path = "src/bin/lbl.rs"

[[bin]]
name = "generate-doc-examples"
path = "src/bin/generate-doc-examples.rs"

[features]
default = ["chromium"]
# In-process headless Chromium via lbl-render (default for CLI / golden tests).
chromium = ["lbl-render/chromium"]
# Bluetooth Low Energy transport (NIIMBOT D-series, DYMO LetraTag LT-200B).
# Opt-in; forwards to `lbl-device`'s `ble` feature, which pulls in `btleplug`
# (and a vendored `libdbus` on Linux).
ble = ["lbl-device/ble"]

[dependencies]
lbl-core            = { workspace = true }
lbl-config          = { workspace = true }
lbl-catalog         = { workspace = true }
lbl-text            = { workspace = true }
lbl-markdown        = { workspace = true }
lbl-template        = { workspace = true }
lbl-transpile-html  = { workspace = true }
lbl-render          = { workspace = true }
lbl-dither          = { workspace = true }
lbl-pattern         = { workspace = true }
lbl-encode          = { workspace = true }
lbl-driver-api      = { workspace = true }
lbl-driver-file     = { workspace = true }
lbl-driver-console  = { workspace = true }
lbl-driver-gpgl     = { workspace = true }
lbl-driver-niimbot  = { workspace = true }
lbl-driver-letratag = { workspace = true }
lbl-device          = { workspace = true }
lbl-spool           = { workspace = true }

serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
clap               = { workspace = true }
lbl-cli            = { workspace = true }
anyhow             = { workspace = true }
chrono             = { workspace = true }
image              = { workspace = true }
base64             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
console            = { workspace = true }
sysinfo            = "0.33"

include_dir = "0.7.4"
ctrlc       = "3.4"
toml        = { workspace = true }

[dev-dependencies]
lbl-core           = { workspace = true }
lbl-catalog        = { workspace = true }
lbl-transpile-html = { workspace = true }
lbl-render         = { workspace = true }
lbl-dither         = { workspace = true }
lbl-driver-file    = { workspace = true }
lbl-template       = { workspace = true }
image              = { workspace = true }
base64             = { workspace = true }
serde_json         = { workspace = true }
