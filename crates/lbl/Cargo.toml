[package]
name = "lbl"
description = "The lbl orchestrator: runs the label-printing pipeline and its individual stages."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lbl"
path = "src/bin/lbl.rs"

[features]
# Bluetooth Low Energy transport (NIIMBOT D-series). Opt-in; forwards to
# `lbl-device`'s `ble` feature, which pulls in `btleplug` (and a vendored
# `libdbus` on Linux).
ble = ["lbl-device/ble"]

[dependencies]
lbl-core = { workspace = true }
lbl-config = { workspace = true }
lbl-catalog = { workspace = true }
lbl-text = { workspace = true }
lbl-markdown = { workspace = true }
lbl-template = { workspace = true }
lbl-transpile-html = { workspace = true }
lbl-render = { workspace = true }
lbl-dither = { workspace = true }
lbl-encode = { workspace = true }
lbl-driver-api = { workspace = true }
lbl-driver-file = { workspace = true }
lbl-driver-console = { workspace = true }
lbl-driver-niimbot = { workspace = true }
lbl-device = { workspace = true }
lbl-spool = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
lbl-core = { workspace = true }
lbl-catalog = { workspace = true }
lbl-transpile-html = { workspace = true }
lbl-render = { workspace = true }
lbl-dither = { workspace = true }
lbl-driver-file = { workspace = true }
lbl-template = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
